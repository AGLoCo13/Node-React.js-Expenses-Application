apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: urbansync-azure-kv
  namespace: urbansync
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # Must match the Key Vault name created in Azure (azure_keyvault_name in secrets.yml)
    keyvaultName: "urbansync-kv-st01"
    # Azure Tenant ID — fill in from: az account show --query tenantId -o tsv
    tenantId: "af4768f2-32f0-412b-afb1-eb4538dbda4b"
    objects: |
      array:
        - |
          objectName: mongo-user
          objectType: secret
        - |
          objectName: mongo-pass
          objectType: secret
        - |
          objectName: mongo-uri
          objectType: secret
        - |
          objectName: rabbitmq-user
          objectType: secret
        - |
          objectName: rabbitmq-pass
          objectType: secret
        - |
          objectName: rabbitmq-url
          objectType: secret
        - |
          objectName: minio-access-key
          objectType: secret
        - |
          objectName: minio-secret-key
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: gemini-api-key
          objectType: secret
  # secretObjects causes the CSI driver to create a K8s Secret when the backend
  # pod mounts this volume. Other pods reference the resulting Secret via secretKeyRef.
  secretObjects:
    - secretName: urbansync-secrets
      type: Opaque
      data:
        - key: mongo-user
          objectName: mongo-user
        - key: mongo-pass
          objectName: mongo-pass
        - key: mongo-uri
          objectName: mongo-uri
        - key: rabbitmq-user
          objectName: rabbitmq-user
        - key: rabbitmq-pass
          objectName: rabbitmq-pass
        - key: rabbitmq-url
          objectName: rabbitmq-url
        - key: minio-access-key
          objectName: minio-access-key
        - key: minio-secret-key
          objectName: minio-secret-key
        - key: jwt-secret
          objectName: jwt-secret
        - key: gemini-api-key
          objectName: gemini-api-key
