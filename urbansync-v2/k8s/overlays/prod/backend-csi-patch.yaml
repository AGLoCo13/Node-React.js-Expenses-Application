apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbansync-backend
  namespace: urbansync
spec:
  template:
    spec:
      containers:
        - name: backend
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "urbansync-azure-kv"
