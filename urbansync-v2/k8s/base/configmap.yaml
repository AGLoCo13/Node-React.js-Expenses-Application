apiVersion: v1
kind: ConfigMap
metadata:
  name: urbansync-config
  namespace: urbansync
data:
  THINGSBOARD_URL: "http://thingsboard:9090"
  BACKEND_PORT: "5000"
  CORS_ORIGIN: "http://localhost"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "receipts"
  # In-cluster URL of the Knative Service (Kourier routes by Host header).
  RECEIPT_ANNOTATOR_URL: "http://receipt-annotator.urbansync.svc.cluster.local"
  RECEIPT_ANNOTATOR_TIMEOUT_MS: "100000"
  # Gemini tuning for receipt extraction (backend direct path + receipt-annotator).
  # 3.x Flash models think by default (medium) — measured 30-40s/receipt with 3.6-flash default,
  # 13-15s with 3.6-flash/low (3/9). Trying flash-lite/minimal next. Change here, not in code.
  # Comma-separated FALLBACK LIST, tried left to right. The free-tier quota is
  # GenerateRequestsPerDayPerProjectPerModel: 20 requests per day PER MODEL. On 21/9 the
  # gemini-flash-latest alias (then gemini-3.8-flash) was exhausted, which is what motivated
  # the list: a 429 is the one error worth retrying elsewhere, because a different model is a
  # different bucket. Only a 429 advances; any other error fails straight out. Concrete ids
  # are pinned on purpose so the bucket does not move when Google repoints an alias.
  # Order is by MEASURED latency, 21/9, same prompt and image on all three:
  #   gemini-3.5-flash-lite      200 in 1.1s
  #   gemini-flash-lite-latest   200 in 1.0s
  #   gemini-3.5-flash           503 UNAVAILABLE, and 31s when it does answer
  # The lite models are first because a live demo cannot wait 30 seconds. Full flash stays
  # last as a quality fallback once the lite buckets are gone.
  GEMINI_MODEL: "gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.5-flash"
  GEMINI_THINKING_LEVEL: "minimal"
  GEMINI_MAX_OUTPUT_TOKENS: "1024"
  # Hedged requests (tail-latency): send a 2nd/3rd identical call if no answer after N ms.
  # Measured 3/9: 43% of calls queue 13-24s at Google with 0 thinking tokens. 0 = off.
  GEMINI_HEDGE_AFTER_MS: "3000"
  GEMINI_MAX_HEDGES: "2"
