# Credentials for the IoT simulation layer (ThingsBoard tenant + simulated device tokens).
#
# These are DEMO values, committed on purpose so that a fresh cluster (local or the
# Azure VM) provisions itself from git with zero manual clicks:
#   - tb-username/tb-password are ThingsBoard's public demo tenant login
#     (https://thingsboard.io/docs/samples/demo-account/); they exist because the
#     tb-postgres image loads demo data on first boot.
#   - tb-token-* are access tokens of SIMULATED devices (Node-RED generators), not
#     real hardware. Anyone with a token can only post fake telemetry for that device.
# For a hardened prod, override this Secret out-of-band (SOPS / Key Vault) exactly like
# urbansync-secrets; the Job and Node-RED only read it by key name.
apiVersion: v1
kind: Secret
metadata:
  name: iot-credentials
  namespace: urbansync
  labels:
    urbansync/component: iot
type: Opaque
stringData:
  tb-username: "tenant@thingsboard.org"
  tb-password: "tenant"
  tb-token-ap1: "95imLZ0MeJ4TO3OHjPbM"
  tb-token-ap2: "qSsXmgBcSaO7gglrqe5s"
  tb-token-ap3: "O4kPcdgFP7gZTkGV9s2H"
  tb-token-fuel: "qmGNgyw3dIEBI0VizCjJ"
