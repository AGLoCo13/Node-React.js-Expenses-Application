apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbansync-frontend
  namespace: urbansync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urbansync-frontend
  template:
    metadata:
      labels:
        app: urbansync-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:5000/urbansync-frontend:50aa0b89
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
