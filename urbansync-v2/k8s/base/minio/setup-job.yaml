# MinIO setup Job — Flow B, step 2: the bucket and its event rule, as code.
#
# What used to be an imperative step in bootstrap-local.ps1 (and did not exist at all for
# the Azure VM) now runs after every ArgoCD sync, idempotently:
#   1. wait until MinIO answers
#   2. create the "receipts" bucket if missing
#   3. bind the webhook target arn:minio:sqs::knative:webhook (declared as env on the
#      MinIO StatefulSet) to the bucket for s3:ObjectCreated:Put events
#   4. print the resulting rule so the Job log is the evidence
#
# Without ArgoCD (plain kubectl apply -k) the hook annotations are ignored and the Job runs
# once; re-run with: kubectl delete job minio-setup -n urbansync && kubectl apply -k ...
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: urbansync
  labels:
    app: minio-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: minio-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # same image as the server: ships both `mc` and a shell (minio/mc alone has no sh)
          image: minio/minio:latest
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "[minio-setup] waiting for http://minio:9000 ..."
              i=0
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                i=$((i+1)); [ $i -gt 90 ] && { echo "[minio-setup] MinIO not reachable after 15 min"; exit 1; }
                sleep 10
              done
              echo "[minio-setup] connected"
              mc mb --ignore-existing "local/$BUCKET"
              echo "[minio-setup] bucket '$BUCKET' present"
              # --ignore-existing keeps this idempotent across syncs
              mc event add "local/$BUCKET" "$WEBHOOK_ARN" --event put --ignore-existing
              echo "[minio-setup] event rule bound: $BUCKET -> $WEBHOOK_ARN (s3:ObjectCreated:Put)"
              mc event list "local/$BUCKET"
              echo "[minio-setup] done"
          env:
            - name: BUCKET
              valueFrom: { configMapKeyRef: { name: urbansync-config, key: MINIO_BUCKET } }
            - name: WEBHOOK_ARN
              value: "arn:minio:sqs::knative:webhook"     # identifier from MINIO_NOTIFY_WEBHOOK_*_knative
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: urbansync-secrets, key: minio-access-key } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: urbansync-secrets, key: minio-secret-key } }
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
