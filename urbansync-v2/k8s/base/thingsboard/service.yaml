apiVersion: v1
kind: Service
metadata:
  name: thingsboard
  namespace: urbansync
spec:
  selector:
    app: thingsboard
  ports:
    - name: http
      port: 9090
      targetPort: 9090
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: coap
      port: 5683
      targetPort: 5683
      protocol: UDP
