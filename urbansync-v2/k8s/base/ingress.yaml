apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urbansync-ingress
  namespace: urbansync
  annotations:
    # Allow multipart uploads up to 10 MB (receipt PDFs / images)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
