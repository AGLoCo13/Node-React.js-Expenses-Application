apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: urbansync
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          command: ["mongod"]
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "50m"
              memory: "384Mi"
            limits:
              cpu: "300m"
              memory: "768Mi"
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: mongo-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: mongo-pass
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
