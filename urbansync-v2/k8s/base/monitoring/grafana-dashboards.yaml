# =============================================================================
# Grafana dashboards ως κώδικας (tasks S6 + application metrics)
# =============================================================================
# Δύο ConfigMaps: ο provider λέει στη Grafana "διάβασε αυτόν τον φάκελο", και ο
# δεύτερος κρατάει τα JSON (ένα key ανά dashboard, εμφανίζονται ως ξεχωριστά
# αρχεία στο mount). Τίποτα δεν φτιάχνεται από το UI: allowUiUpdates: false,
# ώστε μια αλλαγή στο UI να μην αποκλίνει σιωπηλά από το git. Το
# /var/lib/grafana είναι emptyDir, άρα ό,τι δεν είναι εδώ, χάνεται.
#
# ΠΡΟΣΟΧΗ στο datasource uid: τα panels δείχνουν στο uid "prometheus", που
# ορίζεται ρητά στο grafana.yaml. Χωρίς σταθερό uid η Grafana παράγει τυχαίο
# και όλα τα panels γράφουν "Datasource not found".
#
# Τα rate/histogram queries του Application dashboard χρησιμοποιούν
# $__rate_interval, που στηρίζεται στο timeInterval: "15s" του datasource.
#
# Τα user-facing κείμενα (titles, descriptions) είναι στα Αγγλικά κατ' απαίτηση,
# χωρίς em/en dashes.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: urbansync
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: urbansync
        orgId: 1
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: urbansync
data:
  # ---------------------------------------------------------------------------
  # 1. Cluster Overview: πλατφόρμα (kube-state-metrics + cAdvisor)
  # ---------------------------------------------------------------------------
  urbansync-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "links": [
        { "type": "dashboards", "tags": ["urbansync"], "asDropdown": false, "includeVars": false, "keepTime": true, "title": "UrbanSync dashboards" }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["urbansync", "platform"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "UrbanSync Cluster Overview",
      "uid": "urbansync-overview",
      "version": 5,
      "panels": [
        {
          "type": "stat",
          "title": "Running pods (urbansync)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "count(kube_pod_status_phase{namespace=\"urbansync\",phase=\"Running\"} == 1)" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "text" } }, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Node CPU used",
          "description": "Actual CPU burn on the node. Compare this with the reservation figure to the right: they are very different numbers.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[5m])) / sum(machine_cpu_cores)" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Node memory used",
          "description": "Memory is the metric closest to a hard failure on this node. An OOM kill is not recoverable the way a Pending pod is.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(container_memory_working_set_bytes{id=\"/\"}) / sum(machine_memory_bytes)" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 88 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "CPU requests committed",
          "description": "Share of node CPU reserved by pod requests. This fills up long before actual usage does, and it is what the scheduler looks at. At 100 percent new pods stay Pending no matter how idle the node is.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 95 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Backend replicas, desired vs available",
          "description": "The HPA panel. Under load the autoscaler raises desired and available should follow within seconds. A persistent gap means the extra pods cannot be scheduled.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "kube_deployment_spec_replicas{namespace=\"urbansync\",deployment=\"urbansync-backend\"}", "legendFormat": "desired" },
            { "refId": "B", "expr": "kube_deployment_status_replicas_available{namespace=\"urbansync\",deployment=\"urbansync-backend\"}", "legendFormat": "available" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "desired" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } }, { "id": "custom.fillOpacity", "value": 0 } ] },
              { "matcher": { "id": "byName", "options": "available" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
        },
        {
          "type": "timeseries",
          "title": "Container restarts (1h increase)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"urbansync\"}[1h])) by (pod)", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "color": { "mode": "fixed", "fixedColor": "orange" }, "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "CPU usage by pod (urbansync)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"urbansync\",container!=\"\",container!=\"POD\"}[5m])) by (pod)", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 15, "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Memory working set by pod (urbansync)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{namespace=\"urbansync\",container!=\"\",container!=\"POD\"}) by (pod)", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 15, "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        }
      ]
    }

  # ---------------------------------------------------------------------------
  # 2. Application: backend /metrics (prom-client) + ingress-nginx.
  #    Η σειρά των rows ακολουθεί το demo: το πρώτο row είναι η στιγμή 11:30
  #    (k6 burst: request rate, p99, replicas 1->N δίπλα-δίπλα).
  # ---------------------------------------------------------------------------
  urbansync-application.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "links": [
        { "type": "dashboards", "tags": ["urbansync"], "asDropdown": false, "includeVars": false, "keepTime": true, "title": "UrbanSync dashboards" }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["urbansync", "application"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "UrbanSync Application",
      "uid": "urbansync-application",
      "version": 3,
      "panels": [
        {
          "type": "row",
          "title": "Traffic and SLA",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Request rate",
          "description": "Requests per second served by the backend, all routes. Reads 0 when nothing is calling the API, which is normal on an idle demo cluster.",
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "refId": "A", "expr": "sum(rate(http_requests_total[$__rate_interval])) or vector(0)" } ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2, "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Error rate (5xx)",
          "description": "Server side failures as a share of all requests. The Gold SLA tier in the roadmap allows 0.1 percent. Reads No traffic when there are no requests to divide by.",
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * (sum(rate(http_requests_total{code=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(http_requests_total[$__rate_interval]))" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "decimals": 2, "noValue": "No traffic",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 0.1 }, { "color": "red", "value": 1 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "p99 reads (Gold)",
          "description": "99th percentile for the interactive reads: buildings, apartments, expenses. One number per SLA tier, because a p99 mixed across tiers cannot be compared with any single SLO. Thresholds are the measured Gold tier: amber at 1s, red at the 1.5s target.",
          "gridPos": { "h": 4, "w": 5, "x": 10, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{route=~\"/api/(buildings|apartments|expenses)\"}[$__rate_interval])) by (le)) and sum(rate(http_requests_total{route=~\"/api/(buildings|apartments|expenses)\"}[$__rate_interval])) > 0" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s", "min": 0, "decimals": 3, "noValue": "No traffic",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 1.5 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "p99 login (Silver)",
          "description": "99th percentile for POST /api/login. Slower by design: bcrypt cost 10 burns about 75ms of CPU per call, so login gets its own Silver tier. Thresholds: amber at 2s, red at the 3s target.",
          "gridPos": { "h": 4, "w": 5, "x": 15, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{route=\"/api/login\"}[$__rate_interval])) by (le)) and sum(rate(http_requests_total{route=\"/api/login\"}[$__rate_interval])) > 0" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s", "min": 0, "decimals": 3, "noValue": "No traffic",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 2 }, { "color": "red", "value": 3 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Backend replicas",
          "description": "Backend pods that are Ready right now. Under a k6 burst the HPA should push this from 1 towards 4.",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"urbansync\",deployment=\"urbansync-backend\"}" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "purple" } }, "overrides": [] }
        },
        {
          "type": "timeseries",
          "title": "Requests by status class",
          "description": "Traffic split by HTTP status code. A healthy run is mostly 200 and 401, the latter being unauthenticated probes and expired tokens.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total[$__rate_interval])) by (code)", "legendFormat": "{{code}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 25, "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "^2" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byRegexp", "options": "^3" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byRegexp", "options": "^4" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byRegexp", "options": "^5" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Backend replicas, desired vs available",
          "description": "The scale out story. When the HPA raises desired, available should follow within seconds. A lasting gap means the new pods cannot be scheduled on the node.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "kube_deployment_spec_replicas{namespace=\"urbansync\",deployment=\"urbansync-backend\"}", "legendFormat": "desired" },
            { "refId": "B", "expr": "kube_deployment_status_replicas_available{namespace=\"urbansync\",deployment=\"urbansync-backend\"}", "legendFormat": "available" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "decimals": 0, "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "desired" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } }, { "id": "custom.fillOpacity", "value": 0 } ] },
              { "matcher": { "id": "byName", "options": "available" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
        },
        {
          "type": "timeseries",
          "title": "Latency percentiles",
          "description": "p50, p95 and p99 from the histogram buckets, all routes together. The dashed lines at 1s and 1.5s are the measured Gold tier for reads. Login runs above them by design, so read this panel together with the two p99 stats above.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[$__rate_interval])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[$__rate_interval])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[$__rate_interval])) by (le))", "legendFormat": "p99" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s", "min": 0,
              "custom": {
                "drawStyle": "line", "lineWidth": 2, "fillOpacity": 5,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "transparent", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 1.5 }
              ] }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Errors and thrown exceptions",
          "description": "Two different things on one axis. Almost every route in server.js catches its own errors and answers 500, so failures normally appear as 5xx and the exception series stays flat at zero. A non zero exception line means something escaped the handlers entirely.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total{code=~\"5..\"}[$__rate_interval])) by (route)", "legendFormat": "5xx {{route}}" },
            { "refId": "B", "expr": "sum(rate(http_exceptions_total[$__rate_interval])) by (type)", "legendFormat": "exception {{type}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0, "noValue": "No errors", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 } },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "^5xx.*" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] },
              { "matcher": { "id": "byRegexp", "options": "^exception.*" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "table",
          "title": "Routes by latency",
          "description": "Per route p95, p99 and request rate, slowest p99 first. Route labels are Express templates such as /api/expenses/:profId, never raw URLs, so the series count stays bounded. Routes with no traffic in the window are left out.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[$__rate_interval])) by (le, route)) > 0", "format": "table", "instant": true },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[$__rate_interval])) by (le, route)) > 0", "format": "table", "instant": true },
            { "refId": "C", "expr": "sum(rate(http_requests_total[$__rate_interval])) by (route) > 0", "format": "table", "instant": true }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            { "id": "organize", "options": {
              "excludeByName": { "Time": true },
              "indexByName": { "route": 0, "Value #C": 1, "Value #A": 2, "Value #B": 3 },
              "renameByName": { "route": "Route", "Value #A": "p95", "Value #B": "p99", "Value #C": "req/s" }
            } },
            { "id": "sortBy", "options": { "fields": {}, "sort": [ { "field": "p99", "desc": true } ] } }
          ],
          "fieldConfig": {
            "defaults": { "noValue": "No traffic" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "p95" }, "properties": [ { "id": "unit", "value": "s" }, { "id": "decimals", "value": 3 } ] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [ { "id": "unit", "value": "s" }, { "id": "decimals", "value": 3 } ] },
              { "matcher": { "id": "byName", "options": "req/s" }, "properties": [ { "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 } ] }
            ]
          },
          "options": { "showHeader": true }
        },
        {
          "type": "row",
          "title": "Resilience patterns",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 29 },
          "panels": []
        },
        {
          "type": "state-timeline",
          "title": "Circuit breaker state",
          "description": "The three opossum breakers guarding RabbitMQ, MinIO and the Knative function. Open means calls are failing fast instead of hanging, which is the pattern working as designed rather than a bug.",
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "circuit_breaker_state", "legendFormat": "{{name}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "options": {
                  "0": { "text": "Closed", "index": 0 },
                  "1": { "text": "Half open", "index": 1 },
                  "2": { "text": "Open", "index": 2 }
                } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 2 }
              ] }
            },
            "overrides": []
          },
          "options": { "showValue": "auto", "mergeValues": true, "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        },
        {
          "type": "state-timeline",
          "title": "Dependency health",
          "description": "The same three checks the /ready probe runs, exported so an outage is visible here and not only to kubelet. MinIO is polled every 30 seconds because its check is asynchronous.",
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "dependency_up", "legendFormat": "{{name}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "options": {
                  "0": { "text": "Down", "index": 0 },
                  "1": { "text": "Up", "index": 1 }
                } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 1 }
              ] }
            },
            "overrides": []
          },
          "options": { "showValue": "auto", "mergeValues": true, "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        },
        {
          "type": "timeseries",
          "title": "Retry attempts",
          "description": "Retries made by the withRetry helper, labelled by operation. A steady trickle here means a dependency is flapping even though requests are still succeeding.",
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(retry_attempts_total[$__rate_interval])) by (label)", "legendFormat": "{{label}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "decimals": 0, "noValue": "No retries", "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 50 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Idempotency replays",
          "description": "Requests answered by the Idempotency-Key middleware instead of running twice. replayed means a retry got the stored response, in_progress means a duplicate arrived while the first was still running, payload_mismatch means a key was reused for a different request.",
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(idempotency_replays_total[$__rate_interval])) by (outcome)", "legendFormat": "{{outcome}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "decimals": 0, "noValue": "No replays", "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 50, "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "replayed" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "in_progress" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "payload_mismatch" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "row",
          "title": "IoT alarms",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Alarms processed by outcome",
          "description": "Every alarm consumed from the building-alarms queue, by what happened to it. created means notifications were stored. deduplicated means the same alarm arrived again and the unique index stopped a second notification, which is the Idempotency pattern working. unmapped means no recipient could be resolved. deferred means MongoDB was down and the message was requeued once. invalid means the payload could not be used and was parked on building-alarms.dlq.",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 38 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(alarms_processed_total[$__interval])) by (outcome)", "legendFormat": "{{outcome}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "decimals": 0, "noValue": "No alarms yet", "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 70, "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "created" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "deduplicated" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "unmapped" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "deferred" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "invalid" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "bargauge",
          "title": "Alarm outcomes since restart",
          "description": "Counter totals since the backend pod started. Deliberately not increase(): a counter that is born at 1 on the first alarm has no earlier sample to subtract from, so increase() reports zero and the first alarm after every restart would be invisible here.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 38 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(alarms_processed_total) by (outcome)", "legendFormat": "{{outcome}}", "instant": true }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "decimals": 0, "noValue": "No alarms yet", "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "created" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "deduplicated" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "unmapped" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "deferred" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "invalid" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "options": { "orientation": "horizontal", "displayMode": "basic", "showUnfilled": true, "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "row",
          "title": "Edge and runtime",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 46 },
          "panels": [
            {
              "type": "timeseries",
              "title": "Edge traffic at the ingress",
              "description": "Measured by nginx before anything reaches Node. This is the panel that catches what the app cannot see: 404s on paths with no route, and 502s raised while a pod is restarting.",
              "gridPos": { "h": 7, "w": 8, "x": 0, "y": 47 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                { "refId": "A", "expr": "sum(rate(nginx_ingress_controller_requests[$__rate_interval])) by (status)", "legendFormat": "{{status}}" }
              ],
              "fieldConfig": {
                "defaults": { "unit": "reqps", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 25, "stacking": { "mode": "normal" } } },
                "overrides": [
                  { "matcher": { "id": "byRegexp", "options": "^2" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
                  { "matcher": { "id": "byRegexp", "options": "^3" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
                  { "matcher": { "id": "byRegexp", "options": "^4" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
                  { "matcher": { "id": "byRegexp", "options": "^5" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
                ]
              },
              "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
            },
            {
              "type": "timeseries",
              "title": "Node.js heap",
              "description": "Heap in use inside the backend process. Container memory includes buffers and the runtime, so this sits below the pod figure on the cluster dashboard.",
              "gridPos": { "h": 7, "w": 8, "x": 8, "y": 47 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                { "refId": "A", "expr": "sum(nodejs_heap_size_used_bytes{app=\"urbansync-backend\"})", "legendFormat": "used" },
                { "refId": "B", "expr": "sum(nodejs_heap_size_total_bytes{app=\"urbansync-backend\"})", "legendFormat": "total" }
              ],
              "fieldConfig": {
                "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10 } },
                "overrides": []
              },
              "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
            },
            {
              "type": "timeseries",
              "title": "Event loop lag",
              "description": "How long a callback waits before Node runs it. This is the first thing to move when the single thread is saturated, and it climbs well before CPU looks alarming.",
              "gridPos": { "h": 7, "w": 8, "x": 16, "y": 47 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                { "refId": "A", "expr": "max(nodejs_eventloop_lag_p99_seconds{app=\"urbansync-backend\"})", "legendFormat": "p99" },
                { "refId": "B", "expr": "avg(nodejs_eventloop_lag_mean_seconds{app=\"urbansync-backend\"})", "legendFormat": "mean" }
              ],
              "fieldConfig": {
                "defaults": { "unit": "s", "min": 0, "decimals": 4, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10 } },
                "overrides": []
              },
              "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
            }
          ]
        }
      ]
    }
