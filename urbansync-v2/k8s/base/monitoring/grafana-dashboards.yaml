# =============================================================================
# Grafana dashboards ως κώδικας (tasks S6 + application metrics)
# =============================================================================
# Δύο ConfigMaps: ο provider λέει στη Grafana "διάβασε αυτόν τον φάκελο", και ο
# δεύτερος κρατάει τα JSON (ένα key ανά dashboard, εμφανίζονται ως ξεχωριστά
# αρχεία στο mount). Τίποτα δεν φτιάχνεται από το UI — allowUiUpdates: false,
# ώστε μια αλλαγή στο UI να μην αποκλίνει σιωπηλά από το git. Το
# /var/lib/grafana είναι emptyDir, άρα ό,τι δεν είναι εδώ, χάνεται.
#
# ΠΡΟΣΟΧΗ στο datasource uid: τα panels δείχνουν στο uid "prometheus", που
# ορίζεται ρητά στο grafana.yaml. Χωρίς σταθερό uid η Grafana παράγει τυχαίο
# και όλα τα panels γράφουν "Datasource not found".
#
# Τα user-facing κείμενα (titles, descriptions) είναι στα Αγγλικά κατ' απαίτηση.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: urbansync
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: urbansync
        orgId: 1
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: urbansync
data:
  # ---------------------------------------------------------------------------
  # 1. Cluster Overview — πλατφόρμα (kube-state-metrics + cAdvisor)
  # ---------------------------------------------------------------------------
  urbansync-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["urbansync", "platform"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "UrbanSync Cluster Overview",
      "uid": "urbansync-overview",
      "version": 2,
      "panels": [
        {
          "type": "stat",
          "title": "Running pods (urbansync)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "count(kube_pod_status_phase{namespace=\"urbansync\",phase=\"Running\"} == 1)" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Node CPU used",
          "description": "Actual CPU burn on the node. Compare this with the reservation figure to the right: they are very different numbers.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[5m])) / sum(machine_cpu_cores)" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Node memory used",
          "description": "Memory is the metric closest to a hard failure on this node. An OOM kill is not recoverable the way a Pending pod is.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(container_memory_working_set_bytes{id=\"/\"}) / sum(machine_memory_bytes)" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 88 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "CPU requests committed",
          "description": "Share of node CPU reserved by pod requests. This fills up long before actual usage does, and it is what the scheduler looks at. At 100 percent new pods stay Pending no matter how idle the node is.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 95 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Backend replicas, desired vs available",
          "description": "The HPA panel. Under load the autoscaler raises desired and available should follow within seconds. A persistent gap means the extra pods cannot be scheduled.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "kube_deployment_spec_replicas{namespace=\"urbansync\",deployment=\"urbansync-backend\"}", "legendFormat": "desired" },
            { "refId": "B", "expr": "kube_deployment_status_replicas_available{namespace=\"urbansync\",deployment=\"urbansync-backend\"}", "legendFormat": "available" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
        },
        {
          "type": "timeseries",
          "title": "Container restarts (1h increase)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"urbansync\"}[1h])) by (pod)", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "CPU usage by pod (urbansync)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"urbansync\",container!=\"\",container!=\"POD\"}[5m])) by (pod)", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 15, "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Memory working set by pod (urbansync)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{namespace=\"urbansync\",container!=\"\",container!=\"POD\"}) by (pod)", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 15, "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        }
      ]
    }

  # ---------------------------------------------------------------------------
  # 2. Application — από το backend /metrics (prom-client) + ingress-nginx
  # ---------------------------------------------------------------------------
  urbansync-application.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["urbansync", "application"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "UrbanSync Application",
      "uid": "urbansync-application",
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Request rate",
          "description": "Requests per second served by the backend, all routes. Reads No data when there is no traffic, which is normal for an idle demo cluster.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "refId": "A", "expr": "sum(rate(http_requests_total[5m]))" } ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2, "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Success rate",
          "description": "Share of responses in the 2xx and 3xx range. 4xx is excluded on purpose: a rejected login or a validation failure is the app working correctly, not an outage.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(rate(http_requests_total{code=~\"2..|3..\"}[5m])) / sum(rate(http_requests_total[5m]))" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100, "decimals": 2,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "yellow", "value": 95 }, { "color": "green", "value": 99 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Error rate (5xx)",
          "description": "Server side failures as a share of all requests. The Gold SLA tier in the roadmap allows 0.1 percent.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(rate(http_requests_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m]))" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "decimals": 2,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 0.1 }, { "color": "red", "value": 1 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Latency p95",
          "description": "95th percentile across every route. Thresholds follow the SLA tiers: green under 300ms is Gold, amber under 800ms is Silver.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s", "min": 0, "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 0.3 }, { "color": "red", "value": 0.8 }
              ] }
            }, "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Requests by status class",
          "description": "Traffic split by HTTP status code. A healthy run is mostly 200 and 401, the latter being unauthenticated probes and expired tokens.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total[5m])) by (code)", "legendFormat": "{{code}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 25, "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Errors and thrown exceptions",
          "description": "Two different things on one axis. Almost every route in server.js catches its own errors and answers 500, so failures normally appear as 5xx and the exception series stays flat at zero. A non zero exception line means something escaped the handlers entirely.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total{code=~\"5..\"}[5m])) by (route)", "legendFormat": "5xx {{route}}" },
            { "refId": "B", "expr": "sum(rate(http_exceptions_total[5m])) by (type)", "legendFormat": "exception {{type}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Latency percentiles",
          "description": "p50, p95 and p99 from the histogram buckets. The dashed lines at 300ms and 800ms are the Gold and Silver SLA targets.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s", "min": 0,
              "custom": {
                "drawStyle": "line", "lineWidth": 2, "fillOpacity": 5,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "transparent", "value": null }, { "color": "yellow", "value": 0.3 }, { "color": "red", "value": 0.8 }
              ] }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "table",
          "title": "Slowest routes by p95",
          "description": "Per route 95th percentile. Route labels are Express templates such as /api/expenses/:profId, never raw URLs, so the series count stays bounded.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "Value": "p95 (s)" } } },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "p95 (s)", "desc": true }] } }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 }, "overrides": [] },
          "options": { "showHeader": true }
        },
        {
          "type": "state-timeline",
          "title": "Circuit breaker state",
          "description": "The three opossum breakers guarding RabbitMQ, MinIO and the Knative function. Open means calls are failing fast instead of hanging, which is the pattern working as designed rather than a bug.",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "circuit_breaker_state", "legendFormat": "{{name}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "options": {
                  "0": { "text": "Closed", "index": 0 },
                  "1": { "text": "Half open", "index": 1 },
                  "2": { "text": "Open", "index": 2 }
                } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 2 }
              ] }
            },
            "overrides": []
          },
          "options": { "showValue": "auto", "mergeValues": true, "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        },
        {
          "type": "state-timeline",
          "title": "Dependency health",
          "description": "The same three checks the /ready probe runs, exported so an outage is visible here and not only to kubelet. MinIO is polled every 30 seconds because its check is asynchronous.",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "dependency_up", "legendFormat": "{{name}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "options": {
                  "0": { "text": "Down", "index": 0 },
                  "1": { "text": "Up", "index": 1 }
                } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 1 }
              ] }
            },
            "overrides": []
          },
          "options": { "showValue": "auto", "mergeValues": true, "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        },
        {
          "type": "timeseries",
          "title": "Retry attempts",
          "description": "Retries made by the withRetry helper, labelled by operation. A steady trickle here means a dependency is flapping even though requests are still succeeding.",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(retry_attempts_total[5m])) by (label)", "legendFormat": "{{label}}" },
            { "refId": "B", "expr": "sum(rate(idempotency_replays_total[5m])) by (outcome)", "legendFormat": "idempotency {{outcome}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 50 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Edge traffic at the ingress",
          "description": "Measured by nginx before anything reaches Node. This is the panel that catches what the app cannot see: 404s on paths with no route, and 502s raised while a pod is restarting.",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(nginx_ingress_controller_requests[5m])) by (status)", "legendFormat": "{{status}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 25, "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Node.js heap",
          "description": "Heap in use inside the backend process. Container memory includes buffers and the runtime, so this sits below the pod figure on the cluster dashboard.",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "nodejs_heap_size_used_bytes{app=\"urbansync-backend\"}", "legendFormat": "used" },
            { "refId": "B", "expr": "nodejs_heap_size_total_bytes{app=\"urbansync-backend\"}", "legendFormat": "total" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
        },
        {
          "type": "timeseries",
          "title": "Event loop lag",
          "description": "How long a callback waits before Node runs it. This is the first thing to move when the single thread is saturated, and it climbs well before CPU looks alarming.",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "nodejs_eventloop_lag_p99_seconds{app=\"urbansync-backend\"}", "legendFormat": "p99" },
            { "refId": "B", "expr": "nodejs_eventloop_lag_mean_seconds{app=\"urbansync-backend\"}", "legendFormat": "mean" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0, "decimals": 4, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10 } },
