apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbansync-backend
  namespace: urbansync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urbansync-backend
  template:
    metadata:
      annotations:
        # Picked up by the Prometheus `kubernetes-pods` job. /metrics is served by
        # backend/middleware/metrics.js and is NOT reachable from outside: the
        # ingress sends only /api to this pod, so /metrics resolves to the
        # frontend and 404s. Prometheus scrapes the pod IP directly.
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
      labels:
        app: urbansync-backend
    spec:
      containers:
        - name: backend
          image: localhost:5000/urbansync-backend:910c85ee
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: BACKEND_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: CORS_ORIGIN
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: mongo-uri
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: rabbitmq-url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_ENDPOINT
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_PORT
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_USE_SSL
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: minio-secret-key
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_BUCKET
            - name: RECEIPT_ANNOTATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: RECEIPT_ANNOTATOR_URL
            - name: RECEIPT_ANNOTATOR_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: RECEIPT_ANNOTATOR_TIMEOUT_MS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: gemini-api-key
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_MODEL
            - name: GEMINI_THINKING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_THINKING_LEVEL
            - name: GEMINI_MAX_OUTPUT_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_MAX_OUTPUT_TOKENS
            - name: GEMINI_HEDGE_AFTER_MS
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_HEDGE_AFTER_MS
            - name: GEMINI_MAX_HEDGES
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_MAX_HEDGES
