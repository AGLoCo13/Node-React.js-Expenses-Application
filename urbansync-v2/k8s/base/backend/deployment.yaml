apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbansync-backend
  namespace: urbansync
spec:
  # No `replicas:` on purpose. hpa.yaml owns the count; with it in Git, ArgoCD
  # selfHeal would reset every HPA scale-out back to 1.
  # RollingUpdate with no unavailability: new pods take traffic only once the
  # readiness probe passes. (Recreate was needed while the node sat at 100% CPU
  # requests on B2ms; B4as_v2 has room for the surge pod.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: urbansync-backend
  template:
    metadata:
      annotations:
        # Picked up by the Prometheus `kubernetes-pods` job. /metrics is served by
        # backend/middleware/metrics.js and is NOT reachable from outside: the
        # ingress sends only /api to this pod, so /metrics resolves to the
        # frontend and 404s. Prometheus scrapes the pod IP directly.
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
      labels:
        app: urbansync-backend
    spec:
      containers:
        - name: backend
          image: localhost:5000/urbansync-backend:456c1bb6
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          # All probes use /health, not /ready. The server only listens after MongoDB
          # connects, so /health already gates startup. /ready also fails when RabbitMQ
          # or MinIO is down, which would pull every replica out of the Service and 503
          # the whole API instead of letting the circuit breakers degrade gracefully.
          startupProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
            failureThreshold: 30   # up to 5 min of MongoDB connect retries after a boot
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: BACKEND_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: CORS_ORIGIN
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: mongo-uri
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: rabbitmq-url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_ENDPOINT
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_PORT
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_USE_SSL
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: minio-secret-key
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: MINIO_BUCKET
            - name: RECEIPT_ANNOTATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: RECEIPT_ANNOTATOR_URL
            - name: RECEIPT_ANNOTATOR_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: RECEIPT_ANNOTATOR_TIMEOUT_MS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbansync-secrets
                  key: gemini-api-key
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_MODEL
            - name: GEMINI_THINKING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_THINKING_LEVEL
            - name: GEMINI_MAX_OUTPUT_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_MAX_OUTPUT_TOKENS
            - name: GEMINI_HEDGE_AFTER_MS
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_HEDGE_AFTER_MS
            - name: GEMINI_MAX_HEDGES
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: GEMINI_MAX_HEDGES
            - name: THINGSBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: urbansync-config
                  key: THINGSBOARD_URL
            - name: TB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iot-credentials
                  key: tb-username
            - name: TB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-credentials
                  key: tb-password
