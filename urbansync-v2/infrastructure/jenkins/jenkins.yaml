jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-creds"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_PAT}"
              description: "GitHub PAT for repo access"

jobs:
  - script: >
      pipelineJob('urbansync-v2') {
        description('UrbanSync v2 CI/CD pipeline')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/AGLoCo13/Node-React.js-Expenses-Application.git')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('urbansync-v2/Jenkinsfile')
          }
        }
        triggers {
          scm('H/2 * * * *')
        }
        properties {
          githubProjectUrl('https://github.com/AGLoCo13/Node-React.js-Expenses-Application')
        }
      }
