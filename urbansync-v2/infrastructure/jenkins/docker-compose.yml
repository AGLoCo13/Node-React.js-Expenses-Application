services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: urbansync-jenkins:lts
    container_name: urbansync-jenkins
    user: root  # required so the in-container docker CLI can access the mounted socket
    ports:
      - "8080:8080"   # Jenkins web UI
      - "50000:50000" # JNLP agent port (unused for now, kept for future agents)
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount the host Docker socket so `docker build` inside the pipeline
      # talks to the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount host kubeconfig so kubectl inside the pipeline can reach the cluster.
      # Linux (Azure VM): /home/azureuser/.kube
      # Windows (local dev): //c/Users/Stefanos/.kube or //c/Users/billx/.kube
      - /home/azureuser/.kube:/root/.kube:ro
      # Mount JCasC config — Jenkins reads this on every startup.
      - ./jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
    environment:
      # Disable the first-run setup wizard — JCasC handles all configuration.
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      # Tell the JCasC plugin where to find the config file.
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      # Secrets — read from the .env file written by Ansible (or set in shell).
      # Never hardcode these values here.
      - GITHUB_PAT=${GITHUB_PAT}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
    restart: unless-stopped

volumes:
  jenkins_home:
