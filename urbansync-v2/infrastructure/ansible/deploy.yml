---
# =============================================================================
# deploy.yml — Ansible Playbook for UrbanSync Deployment
# =============================================================================
# Σκοπός: Αυτόματο deployment της εφαρμογής UrbanSync στο Azure VM
#         - Δημιουργία φακέλου προορισμού /opt/urbansync/
#         - Αντιγραφή του φακέλου urbansync-v2 στον server
#         - Εκκίνηση τοπικού Docker Registry (infrastructure/registry/)
#         - Εφαρμογή Kubernetes manifests με σωστή σειρά
#         - Εκκίνηση Jenkins (infrastructure/jenkins/)
# Χρήση:  ansible-playbook -i inventory.ini deploy.yml
# =============================================================================

- name: Deploy UrbanSync to Azure VM
  hosts: azure_vm
  become: true
  gather_facts: true

  vars_files:
    - vars/secrets.yml

  vars:
    # Φάκελος προορισμού στον remote server
    deploy_dest: /opt/urbansync

    # Τοπικός φάκελος πηγής (σχετικά με το playbook)
    local_src: "{{ playbook_dir }}/../../.."

    # Φάκελος της εφαρμογής στον server
    app_dir: "{{ deploy_dest }}/urbansync-v2"

    # Χρήστης που τρέχει τις εντολές (non-root για kubectl)
    deploy_user: azureuser

  # ---------------------------------------------------------------------------
  # BLOCK 1 — Δημιουργία φακέλου προορισμού
  # ---------------------------------------------------------------------------
  tasks:
    - name: "1 | Δημιουργία φακέλου προορισμού {{ deploy_dest }}"
      ansible.builtin.file:
        path: "{{ deploy_dest }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    # ---------------------------------------------------------------------------
    # BLOCK 2 — Αντιγραφή φακέλου urbansync-v2 στον server
    # ---------------------------------------------------------------------------
    - name: "2 | Αντιγραφή φακέλου urbansync-v2 → {{ app_dir }}"
      ansible.builtin.copy:
        src: "{{ local_src }}/urbansync-v2/"
        dest: "{{ app_dir }}/"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: preserve
      # Η trailing slash στο src αντιγράφει τα περιεχόμενα (όχι τον ίδιο τον φάκελο)

    # ---------------------------------------------------------------------------
    # BLOCK 3 — Εκκίνηση τοπικού Docker Registry
    # ---------------------------------------------------------------------------
    - name: "3 | Εκκίνηση Docker Registry (infrastructure/registry/)"
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/infrastructure/registry"
        state: present
        pull: missing
      # Χρησιμοποιεί το docker-compose.yml στο infrastructure/registry/
      # Ξεκινά το container urbansync-registry στη θύρα 5000

    # ---------------------------------------------------------------------------
    # BLOCK 4 — Εφαρμογή Kubernetes manifests (με σωστή σειρά)
    # ---------------------------------------------------------------------------

    # 4a. Πρώτα το namespace — πρέπει να υπάρχει πριν από οτιδήποτε άλλο
    - name: "4a | kubectl apply — k8s/namespace.yaml"
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ app_dir }}/k8s/namespace.yaml"
      become: true
      become_user: "{{ deploy_user }}"
      register: ns_result
      changed_when: "'configured' in ns_result.stdout or 'created' in ns_result.stdout"

    - name: "4a | Αποτέλεσμα namespace"
      ansible.builtin.debug:
        msg: "{{ ns_result.stdout_lines }}"

    # 4b. Μετά τα secrets — χρειάζονται πριν τα deployments
    - name: "4b | kubectl apply — k8s/secrets.yaml"
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ app_dir }}/k8s/secrets.yaml"
      become: true
      become_user: "{{ deploy_user }}"
      register: secrets_result
      changed_when: "'configured' in secrets_result.stdout or 'created' in secrets_result.stdout"

    - name: "4b | Αποτέλεσμα secrets"
      ansible.builtin.debug:
        msg: "{{ secrets_result.stdout_lines }}"

    # 4c. Τέλος, ολόκληρος ο φάκελος k8s/ (recursive) — καλύπτει όλα τα υπόλοιπα manifests
    - name: "4c | kubectl apply — k8s/ (recursive, όλα τα υπόλοιπα manifests)"
      ansible.builtin.command:
        cmd: kubectl apply -R -f "{{ app_dir }}/k8s/"
      become: true
      become_user: "{{ deploy_user }}"
      register: k8s_result
      changed_when: "'configured' in k8s_result.stdout or 'created' in k8s_result.stdout"

    - name: "4c | Αποτέλεσμα k8s/ (recursive)"
      ansible.builtin.debug:
        msg: "{{ k8s_result.stdout_lines }}"

    # ---------------------------------------------------------------------------
    # BLOCK 5 — Εκκίνηση Jenkins
    # ---------------------------------------------------------------------------

    # Write a .env file that docker-compose picks up automatically.
    # This injects GITHUB_PAT into the Jenkins container so JCasC can
    # interpolate ${GITHUB_PAT} in jenkins.yaml without hardcoding it.
    - name: "5a | Γράψε .env με GITHUB_PAT για το docker-compose του Jenkins"
      ansible.builtin.copy:
        dest: "{{ app_dir }}/infrastructure/jenkins/.env"
        content: "GITHUB_PAT={{ github_pat }}\n"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: "5b | Εκκίνηση Jenkins (infrastructure/jenkins/)"
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/infrastructure/jenkins"
        state: present
        pull: missing
      # Χρησιμοποιεί το docker-compose.yml στο infrastructure/jenkins/
      # Builds το custom image urbansync-jenkins:lts και ξεκινά τον container

    # ---------------------------------------------------------------------------
    # BLOCK 6 — Τελικό μήνυμα
    # ---------------------------------------------------------------------------
    - name: "6 | Deployment ολοκληρώθηκε"
      ansible.builtin.debug:
        msg: |
          🎉 UrbanSync Deployment Complete!
          ✅ Φάκελος εφαρμογής : {{ app_dir }}
          ✅ Docker Registry   : http://{{ inventory_hostname }}:5000
          ✅ Kubernetes        : namespace, secrets και όλα τα manifests εφαρμόστηκαν
          ✅ Jenkins UI        : http://{{ inventory_hostname }}:8080
