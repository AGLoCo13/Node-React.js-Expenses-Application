---
# =============================================================================
# deploy.yml — Ansible Playbook for UrbanSync Deployment
# =============================================================================
# Σκοπός: Αυτόματο deployment της εφαρμογής UrbanSync στο Azure VM
#         - Δημιουργία φακέλου προορισμού /opt/urbansync/
#         - Αντιγραφή του φακέλου urbansync-v2 στον server
#         - Εκκίνηση τοπικού Docker Registry (infrastructure/registry/)
#         - Εφαρμογή Kubernetes manifests με σωστή σειρά
#         - Εκκίνηση Jenkins (infrastructure/jenkins/)
# Χρήση:  ansible-playbook -i inventory.ini deploy.yml
# =============================================================================

- name: Deploy UrbanSync
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Φάκελος προορισμού στον remote server
    deploy_dest: /opt/urbansync

    # Τοπικός φάκελος πηγής (σχετικά με το playbook)
    local_src: "{{ playbook_dir }}/../../.."

    # Φάκελος της εφαρμογής στον server
    app_dir: "{{ deploy_dest }}/urbansync-v2"

    # Χρήστης που τρέχει τις εντολές (non-root για kubectl)
    deploy_user: azureuser

    # Collections που φορτώνει το BLOCK 4e (μόνο με -e seed_db=true).
    # Η σειρά δεν παίζει ρόλο — δεν υπάρχουν foreign keys στη Mongo.
    seed_collections:
      - users
      - profiles
      - buildings
      - apartments
      - expenses
      - consumptions
      - payments

  # ---------------------------------------------------------------------------
  # BLOCK 1 — Δημιουργία φακέλου προορισμού
  # ---------------------------------------------------------------------------
  tasks:
    # ---------------------------------------------------------------------------
    # BLOCK 0 — Decrypt secrets (SOPS + age)
    # ---------------------------------------------------------------------------
    - name: "0 | Decrypt secrets (SOPS + age)"
      community.sops.load_vars:
        file: "{{ playbook_dir }}/vars/secrets.enc.yml"
      no_log: true

    - name: "1 | Δημιουργία φακέλου προορισμού {{ deploy_dest }}"
      ansible.builtin.file:
        path: "{{ deploy_dest }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    # ---------------------------------------------------------------------------
    # BLOCK 2 — Αντιγραφή φακέλου urbansync-v2 στον server
    # ---------------------------------------------------------------------------
    - name: "2 | Sync urbansync-v2/ → {{ app_dir }} (rsync, only changed files)"
      ansible.posix.synchronize:
        src: "{{ local_src }}/urbansync-v2/"
        dest: "{{ app_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=*.log"
      become: false

    # ---------------------------------------------------------------------------
    # BLOCK 3 — Εκκίνηση τοπικού Docker Registry
    # ---------------------------------------------------------------------------
    - name: "3 | Εκκίνηση Docker Registry (infrastructure/registry/)"
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/infrastructure/registry"
        state: present
        pull: missing
      # Χρησιμοποιεί το docker-compose.yml στο infrastructure/registry/
      # Ξεκινά το container urbansync-registry στη θύρα 5000

    # ---------------------------------------------------------------------------
    # BLOCK 4 — Εφαρμογή Kubernetes manifests (με σωστή σειρά)
    # ---------------------------------------------------------------------------

    # 4a. Πρώτα το namespace — πρέπει να υπάρχει πριν από οτιδήποτε άλλο
    - name: "4a | kubectl apply — k8s/base/namespace.yaml"
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ app_dir }}/k8s/base/namespace.yaml"
      become: true
      become_user: "{{ deploy_user }}"
      register: ns_result
      changed_when: "'configured' in ns_result.stdout or 'created' in ns_result.stdout"

    - name: "4a | Αποτέλεσμα namespace"
      ansible.builtin.debug:
        msg: "{{ ns_result.stdout_lines }}"

    # ---------------------------------------------------------------------------
    # BLOCK 4b — Apply urbansync-secrets K8s Secret (from SOPS-decrypted vars)
    # ---------------------------------------------------------------------------
    - name: "4b | Apply urbansync-secrets K8s Secret"
      ansible.builtin.command:
        cmd: kubectl apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: urbansync-secrets
            namespace: urbansync
          type: Opaque
          stringData:
            mongo-user: "{{ mongo_user }}"
            mongo-pass: "{{ mongo_pass }}"
            mongo-uri: "{{ mongo_uri }}"
            rabbitmq-user: "{{ rabbitmq_user }}"
            rabbitmq-pass: "{{ rabbitmq_pass }}"
            rabbitmq-url: "{{ rabbitmq_url }}"
            minio-access-key: "{{ minio_access_key }}"
            minio-secret-key: "{{ minio_secret_key }}"
            jwt-secret: "{{ jwt_secret }}"
            gemini-api-key: "{{ gemini_api_key }}"
      become: true
      become_user: "{{ deploy_user }}"
      register: k8s_secret_result
      changed_when: "'created' in k8s_secret_result.stdout or 'configured' in k8s_secret_result.stdout"
      no_log: true

    # ---------------------------------------------------------------------------
    # BLOCK 4b.5 — Εγκατάσταση Knative Serving v1.14.0 (απαιτείται για kservice.yaml)
    # ---------------------------------------------------------------------------

    - name: "4b.5a | Εγκατάσταση Knative Serving CRDs"
      ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.14.0/serving-crds.yaml
      become: true
      become_user: "{{ deploy_user }}"
      register: knative_crds_result
      changed_when: "'configured' in knative_crds_result.stdout or 'created' in knative_crds_result.stdout"

    - name: "4b.5b | Εγκατάσταση Knative Serving core"
      ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.14.0/serving-core.yaml
      become: true
      become_user: "{{ deploy_user }}"
      register: knative_core_result
      changed_when: "'configured' in knative_core_result.stdout or 'created' in knative_core_result.stdout"

    - name: "4b.5c | Αναμονή Knative controller"
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/controller -n knative-serving --timeout=300s
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    - name: "4b.5c2 | Αναμονή Knative webhook"
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/webhook -n knative-serving --timeout=300s
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    - name: "4b.5d | Εγκατάσταση Kourier (networking layer)"
      ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/knative/net-kourier/releases/download/knative-v1.14.0/kourier.yaml
      become: true
      become_user: "{{ deploy_user }}"
      register: kourier_result
      changed_when: "'configured' in kourier_result.stdout or 'created' in kourier_result.stdout"

    - name: "4b.5e | Ρύθμιση Knative να χρησιμοποιεί Kourier"
      ansible.builtin.command:
        cmd: >
          kubectl patch configmap/config-network
          --namespace knative-serving
          --type merge
          --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    # Το Knative controller τρέχει ΜΕΣΑ σε pod. Για να «κλειδώσει» ένα image σε digest
    # κάνει resolve το tag από το registry — αλλά localhost:5000 μέσα στο pod είναι το
    # ίδιο το pod, όχι ο host. Χωρίς αυτό το patch κάθε Revision μένει
    # ContainerMissing / "dial tcp [::1]:5000: connection refused" και το backend
    # απαντά 502 στο knative-extract. Το kubelet (στον host) τραβάει το image κανονικά.
    - name: "4b.5e2 | Knative: skip tag-to-digest resolution για το τοπικό registry"
      ansible.builtin.command:
        cmd: >
          kubectl patch configmap/config-deployment
          --namespace knative-serving
          --type merge
          --patch '{"data":{"registries-skipping-tag-resolving":"kind.local,ko.local,dev.local,localhost:5000"}}'
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    # The upstream Knative/Kourier manifests request 300m+200m+200m CPU by default.
    # On a 2-vCPU VM that's enough alone to starve the CSI driver pods of room to
    # schedule (saw them stuck Pending for 4 days). Re-applying the upstream YAML
    # above resets these on every run, so re-trim them right after every time.
    - name: "4b.5f | Μείωση CPU requests σε Knative/Kourier (μικρός κόμβος)"
      ansible.builtin.command:
        cmd: kubectl set resources deployment/{{ item.name }} -n {{ item.namespace }} --requests=cpu={{ item.cpu }}
      loop:
        - { name: activator,               namespace: knative-serving, cpu: 100m }
        - { name: 3scale-kourier-gateway,   namespace: kourier-system,  cpu: 100m }
        - { name: net-kourier-controller,   namespace: knative-serving, cpu: 50m }
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    # CPU requests were at 93% (1870m/2000m) on this 2-vCPU node, entirely from infra —
    # not enough headroom left to give the actual app workloads (mongodb/thingsboard/etc.)
    # any real CPU request. Free more by trimming components where redundancy/default
    # sizing doesn't make sense on a single-node VM. Azure-only — Docker Desktop isn't
    # CPU-constrained and likely doesn't even run calico-node.
    - name: "4b.5g | Μείωση CoreDNS replicas σε 1 (μονός κόμβος, redundancy άσκοπη)"
      ansible.builtin.command:
        cmd: kubectl scale deployment/coredns -n kube-system --replicas=1
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4b.5h | Μείωση CPU request calico-node (250m -> 100m)"
      ansible.builtin.command:
        cmd: kubectl set resources daemonset/calico-node -n kube-system --requests=cpu=100m
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    # Το baremetal manifest (όχι το cloud): ο κόμβος είναι σκέτο kubeadm χωρίς
    # cloud-controller-manager, οπότε ένα Service type=LoadBalancer θα έμενε
    # για πάντα σε <pending> και το http://<public-ip> δεν θα έφτανε ποτέ στο cluster.
    - name: "4b.5i | Εγκατάσταση nginx ingress controller"
      ansible.builtin.command:
        cmd: >
          kubectl apply -f
          https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    # Ένα patch, ένα rollout: hostNetwork ώστε ο controller να δεσμεύσει
    # απευθείας το :80/:443 του κόμβου (το NSG επιτρέπει ήδη 80), και ταυτόχρονα
    # το CPU request trim (100m -> 50m) για τον μικρό κόμβο.
    - name: "4b.5i2 | hostNetwork + CPU request στον ingress-nginx-controller"
      ansible.builtin.command:
        cmd: >
          kubectl patch deployment ingress-nginx-controller -n ingress-nginx
          -p '{"spec":{"template":{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet","containers":[{"name":"controller","resources":{"requests":{"cpu":"50m"}}}]}}}}'
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4b.5i3 | Αναμονή ingress-nginx-controller"
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    # ---------------------------------------------------------------------------
    # BLOCK 4d — Εγκατάσταση Secrets Store CSI Driver + Azure Key Vault provider
    # ---------------------------------------------------------------------------

    - name: "4d.0 | Εγκατάσταση Helm (αν δεν υπάρχει)"
      ansible.builtin.shell:
        cmd: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.1 | Helm repo — secrets-store-csi-driver"
      ansible.builtin.command:
        cmd: helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.2 | Helm repo — csi-secrets-store-provider-azure"
      ansible.builtin.command:
        cmd: helm repo add csi-secrets-store-provider-azure https://azure.github.io/secrets-store-csi-driver-provider-azure/charts
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.3 | Helm repo update"
      ansible.builtin.command:
        cmd: helm repo update
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.4 | Εγκατάσταση Secrets Store CSI Driver"
      ansible.builtin.command:
        cmd: >
          helm upgrade --install csi-secrets-store
          secrets-store-csi-driver/secrets-store-csi-driver
          -n kube-system --set syncSecret.enabled=true
          --version 1.4.8
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.5 | Εγκατάσταση Azure Key Vault provider"
      ansible.builtin.command:
        cmd: >
          helm upgrade --install azure-csi-provider
          csi-secrets-store-provider-azure/csi-secrets-store-provider-azure
          -n kube-system
          --version 1.5.3
          --set secrets-store-csi-driver.install=false
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.5b | Εγκατάσταση Azure CLI (αν δεν υπάρχει)"
      ansible.builtin.shell:
        cmd: curl -sL https://aka.ms/InstallAzureCLIDeb | bash
      args:
        creates: /usr/bin/az
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.5c | az login με Managed Identity"
      ansible.builtin.command:
        cmd: az login --identity
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    - name: "4d.6 | Populate Azure Key Vault με secrets"
      ansible.builtin.command:
        cmd: >
          az keyvault secret set
          --vault-name "{{ azure_keyvault_name }}"
          --name "{{ item.name }}"
          --value "{{ item.value }}"
      loop:
        - { name: mongo-user,       value: "{{ mongo_user | default('admin') }}" }
        - { name: mongo-pass,       value: "{{ mongo_pass | default('admin123') }}" }
        - { name: mongo-uri,        value: "{{ mongo_uri | default('mongodb://admin:admin123@mongodb:27017/commons-db?authSource=admin') }}" }
        - { name: rabbitmq-user,    value: "{{ rabbitmq_user | default('admin') }}" }
        - { name: rabbitmq-pass,    value: "{{ rabbitmq_pass | default('admin123') }}" }
        - { name: rabbitmq-url,     value: "{{ rabbitmq_url | default('amqp://admin:admin123@rabbitmq:5672') }}" }
        - { name: minio-access-key, value: "{{ minio_access_key | default('admin') }}" }
        - { name: minio-secret-key, value: "{{ minio_secret_key | default('password123') }}" }
        - { name: jwt-secret,       value: "{{ jwt_secret | default('your-secret-key') }}" }
        - { name: gemini-api-key,   value: "{{ gemini_api_key | default('REPLACE_WITH_REAL_KEY') }}" }
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: deploy_env | default('prod') == 'prod'

    # 4c. Εφαρμογή Kustomize overlay (local ή prod ανάλογα με deploy_env)
    - name: "4c | kubectl apply -k k8s/overlays/{{ deploy_env | default('prod') }}/"
      ansible.builtin.command:
        cmd: kubectl apply -k "{{ app_dir }}/k8s/overlays/{{ deploy_env | default('prod') }}/"
      become: true
      become_user: "{{ deploy_user }}"
      register: k8s_result
      changed_when: "'configured' in k8s_result.stdout or 'created' in k8s_result.stdout"

    - name: "4c | Αποτέλεσμα k8s overlay"
      ansible.builtin.debug:
        msg: "{{ k8s_result.stdout_lines }}"

    # ---------------------------------------------------------------------------
    # BLOCK 4e — Seed MongoDB  (OPT-IN:  ansible-playbook ... -e seed_db=true)
    # ---------------------------------------------------------------------------
    # ΠΡΟΣΟΧΗ: το mongoimport τρέχει με --drop, δηλαδή ΣΒΗΝΕΙ και ξαναφορτώνει τις
    # 7 collections. Γι' αυτό είναι opt-in — ένα σκέτο deploy.yml δεν τ' αγγίζει.
    #
    # Τα JSON βρίσκονται στη ΡΙΖΑ του repo ("JSON DB Collections/"), ΕΚΤΟΣ του
    # urbansync-v2/, οπότε το task 2 δεν τα συγχρονίζει — τα στέλνουμε ξεχωριστά.
    - name: "4e.1 | Συγχρονισμός seed JSON στο VM"
      ansible.posix.synchronize:
        src: "{{ local_src }}/JSON DB Collections/"
        dest: "{{ deploy_dest }}/seed-data/"
      when: seed_db | default(false) | bool

    - name: "4e.2 | Αναμονή MongoDB pod"
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=ready pod -l app=mongodb -n urbansync --timeout=300s
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: seed_db | default(false) | bool

    - name: "4e.3 | Αντιγραφή seed JSON μέσα στο pod"
      ansible.builtin.command:
        cmd: kubectl cp "{{ deploy_dest }}/seed-data/{{ item }}.json" urbansync/mongodb-0:/tmp/{{ item }}.json
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      loop: "{{ seed_collections }}"
      when: seed_db | default(false) | bool

    # Το mongoimport υπάρχει ήδη μέσα στο mongo image — δεν χρειάζεται
    # port-forward ούτε MongoDB Database Tools στον host (σε αντίθεση με το
    # import-db-k8s.ps1 που είναι γραμμένο για Docker Desktop από Windows).
    - name: "4e.4 | mongoimport (--drop) μέσα στο pod"
      # Τα credentials τα διαβάζει το sh ΜΕΣΑ στο pod από το ίδιο του το env,
      # οπότε δεν εμφανίζονται ποτέ στην command line ούτε στο output — άρα
      # δεν χρειάζεται no_log και τα σφάλματα παραμένουν ορατά.
      ansible.builtin.command:
        cmd: >
          kubectl exec -n urbansync mongodb-0 -- sh -c
          'mongoimport --db commons-db --authenticationDatabase admin
          -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
          --collection {{ item }} --file /tmp/{{ item }}.json --drop'
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true
      loop: "{{ seed_collections }}"
      when: seed_db | default(false) | bool

    - name: "4e.5 | Καθαρισμός προσωρινών αρχείων"
      ansible.builtin.command:
        cmd: kubectl exec -n urbansync mongodb-0 -- sh -c "rm -f /tmp/*.json"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false
      when: seed_db | default(false) | bool

    # ---------------------------------------------------------------------------
    # BLOCK 5 — Εκκίνηση Jenkins
    # ---------------------------------------------------------------------------

    # Write a .env file that docker-compose picks up automatically.
    # This injects GITHUB_PAT into the Jenkins container so JCasC can
    # interpolate ${GITHUB_PAT} in jenkins.yaml without hardcoding it.
    - name: "5a | Γράψε .env με GITHUB_PAT για το docker-compose του Jenkins"
      ansible.builtin.copy:
        dest: "{{ app_dir }}/infrastructure/jenkins/.env"
        content: "GITHUB_PAT={{ github_pat }}\nJENKINS_ADMIN_PASSWORD={{ jenkins_admin_password }}\nGITHUB_USERNAME={{ github_username }}\n"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: "5b | Build + εκκίνηση Jenkins (infrastructure/jenkins/)"
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/infrastructure/jenkins"
        state: present
        build: always
        pull: missing
      # Χρησιμοποιεί το docker-compose.yml στο infrastructure/jenkins/
      # Builds το custom image urbansync-jenkins:lts και ξεκινά τον container

    # ---------------------------------------------------------------------------
    # BLOCK 6 — Εγκατάσταση και ρύθμιση ArgoCD
    # ---------------------------------------------------------------------------

    - name: "6a | Δημιουργία namespace argocd"
      ansible.builtin.command:
        cmd: kubectl create namespace argocd --dry-run=client -o yaml
      become: true
      become_user: "{{ deploy_user }}"
      register: argocd_ns_yaml
      changed_when: false

    - name: "6a | Εφαρμογή namespace argocd"
      ansible.builtin.command:
        cmd: kubectl apply -f -
      args:
        stdin: "{{ argocd_ns_yaml.stdout }}"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    - name: "6b | Εγκατάσταση ArgoCD (upstream stable manifest, server-side apply)"
      ansible.builtin.command:
        cmd: kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      become: true
      become_user: "{{ deploy_user }}"
      register: argocd_install_result
      changed_when: "'configured' in argocd_install_result.stdout or 'created' in argocd_install_result.stdout"

    - name: "6b | Αναμονή ArgoCD server deployment"
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    - name: "6c | Γράψε repo-secret.yaml από secrets.yml"
      ansible.builtin.copy:
        dest: "{{ app_dir }}/infrastructure/argocd/repo-secret.yaml"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: urbansync-repo-credentials
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          type: Opaque
          stringData:
            type: git
            url: https://github.com/AGLoCo13/Node-React.js-Expenses-Application.git
            username: {{ github_username }}
            password: {{ github_pat }}
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: "6d | Εφαρμογή repo-secret στο cluster"
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ app_dir }}/infrastructure/argocd/repo-secret.yaml"
      become: true
      become_user: "{{ deploy_user }}"
      register: repo_secret_result
      changed_when: "'created' in repo_secret_result.stdout or 'configured' in repo_secret_result.stdout"

    - name: "6e | Εφαρμογή ArgoCD Application CR (prod)"
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ app_dir }}/infrastructure/argocd/application-prod.yaml"
      become: true
      become_user: "{{ deploy_user }}"
      register: app_result
      changed_when: "'created' in app_result.stdout or 'configured' in app_result.stdout"

    # ---------------------------------------------------------------------------
    # BLOCK 7 — Τελικό μήνυμα
    # ---------------------------------------------------------------------------
    - name: "7 | Deployment ολοκληρώθηκε"
      ansible.builtin.debug:
        msg: |
          🎉 UrbanSync Deployment Complete!
          ✅ Φάκελος εφαρμογής : {{ app_dir }}
          ✅ Docker Registry   : http://{{ inventory_hostname }}:5000
          ✅ Kubernetes        : namespace, secrets και όλα τα manifests εφαρμόστηκαν
          ✅ Jenkins UI        : http://{{ inventory_hostname }}:8080
