---
# =============================================================================
# setup-k8s.yml — Εγκατάσταση Full K8s (kubeadm) & Docker στο Azure
# =============================================================================
- name: Setup Full Kubernetes and Docker on Azure VM
  hosts: azure_vm
  become: true
  gather_facts: true

  vars:
    k8s_user: azureuser
    k8s_version: "1.29"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Προετοιμασία Συστήματος (Swap & Kernel)
    # -------------------------------------------------------------------------
    - name: Disable swap (K8s requirement)
      command: swapoff -a
      changed_when: false

    - name: Disable swap permanently in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Load kernel modules for containerd
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Set sysctl parameters for K8s
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { name: "net.ipv4.ip_forward", value: "1" }

    # -------------------------------------------------------------------------
    # 2. Εγκατάσταση Docker & Containerd
    # -------------------------------------------------------------------------
    - name: Install dependencies
      apt:
        name: [apt-transport-https, ca-certificates, curl, gpg]
        state: present
        update_cache: yes

    - name: Install Docker and Docker Compose
      apt:
        name: [docker.io, docker-compose-v2]
        state: present

    - name: Add user to docker group
      user:
        name: "{{ k8s_user }}"
        groups: docker
        append: yes

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configure SystemdCgroup for containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: "SystemdCgroup = false"
        replace: "SystemdCgroup = true"
      notify: restart containerd

    # ΚΡΙΣΙΜΟ: ο handler "restart containerd" κανονικά τρέχει στο ΤΕΛΟΣ του play,
    # δηλαδή ΜΕΤΑ το kubeadm init. Χωρίς αυτό το flush, το init τρέχει πάνω σε
    # containerd που δεν έχει φορτώσει το SystemdCgroup=true, ενώ το kubelet
    # (k8s 1.29) χρησιμοποιεί systemd cgroup driver. Το mismatch κάνει τα
    # control-plane static pods να κάνουν restart συνέχεια και ο API server
    # πέφτει ("connection refused" στο 6443 όταν εφαρμόζεται το Calico).
    # Επιπλέον: αν το play αποτύχει, οι handlers ΔΕΝ τρέχουν ποτέ.
    - name: Create certs.d dir for the local registry
      file:
        path: /etc/containerd/certs.d/localhost:5000
        state: directory
        mode: "0755"

    # Το containerd 2.x έχει ήδη config_path = '/etc/containerd/certs.d:...'
    # στο default config, οπότε αρκεί να υπάρχει αυτό το αρχείο.
    - name: Trust localhost:5000 over plain HTTP
      copy:
        dest: /etc/containerd/certs.d/localhost:5000/hosts.toml
        mode: "0644"
        content: |
          server = "http://localhost:5000"

          [host."http://localhost:5000"]
            capabilities = ["pull", "resolve"]
            skip_verify = true
      notify: restart containerd

    - name: Apply containerd config before kubeadm init (flush handlers)
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    # 3. Εγκατάσταση Εργαλείων K8s (kubeadm, kubelet, kubectl)
    # -------------------------------------------------------------------------
    - name: Ensure keyrings dir exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes apt GPG key
      shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: yes

    # -------------------------------------------------------------------------
    # 4. Αρχικοποίηση K8s (Μόνο την πρώτη φορά)
    # -------------------------------------------------------------------------
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_conf

    - name: Initialize K8s cluster
      command: kubeadm init --pod-network-cidr=192.168.0.0/16
      when: not kubeadm_conf.stat.exists

    # -------------------------------------------------------------------------
    # 5. Ρύθμιση πρόσβασης για τον azureuser
    # -------------------------------------------------------------------------
    - name: Create .kube directory for user
      file:
        path: "/home/{{ k8s_user }}/.kube"
        state: directory
        owner: "{{ k8s_user }}"
        group: "{{ k8s_user }}"
        mode: "0755"

    - name: Copy admin.conf to user's kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ k8s_user }}/.kube/config"
        remote_src: yes
        owner: "{{ k8s_user }}"
        group: "{{ k8s_user }}"
        mode: "0600"

    # -------------------------------------------------------------------------
    # 6. Εγκατάσταση Δικτύου (Calico) & Untaint
    # -------------------------------------------------------------------------
    # Το kubeadm init μπορεί να επιστρέψει ενώ ο API server ακόμα σταθεροποιείται.
    # Χωρίς αυτή την αναμονή, το Calico apply σκάει με "connection refused".
    - name: Wait for the API server to report ready
      become: false
      ansible.builtin.command:
        cmd: kubectl get --raw /readyz
      register: apiserver_ready
      until: apiserver_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    # ΧΩΡΙΣ guard "when: not kubeadm_conf.stat.exists": μετά από αποτυχημένο run
    # το admin.conf ΥΠΑΡΧΕΙ ήδη, οπότε το retry θα προσπερνούσε σιωπηλά το Calico
    # — ακριβώς τότε που το χρειάζεσαι. Το kubectl apply είναι ούτως ή άλλως idempotent.
    - name: Install Calico Pod Network
      become: false
      command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml

    # -------------------------------------------------------------------------
    # 7. StorageClass — το σκέτο kubeadm ΔΕΝ έχει provisioner ούτε default class.
    #    Τα PVC στο k8s/base/*/pvc.yaml δεν ορίζουν storageClassName, άρα
    #    βασίζονται σε default. Χωρίς αυτό μένουν Pending για πάντα και τα
    #    mongodb/rabbitmq/minio/thingsboard/nodered δεν προγραμματίζονται καν.
    # -------------------------------------------------------------------------
    - name: Install local-path-provisioner (single-node storage)
      become: false
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
      changed_when: false

    - name: Make local-path the default StorageClass
      become: false
      command: >
        kubectl patch storageclass local-path
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      changed_when: false

    - name: Untaint the master node (allow pods on control-plane)
      become: false
      command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      changed_when: false
      ignore_errors: yes

  handlers:
    - name: restart containerd
      systemd:
        name: containerd
        state: restarted
        daemon_reload: yes
