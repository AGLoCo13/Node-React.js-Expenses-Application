version: '3.8'

services:
  # 1. FRONTEND (React + Nginx bundle)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbansync-frontend
    ports:
      - "80:80"  # ΑΛΛΑΓΗ: Βγάλαμε το 3000 για να μπαίνεις κατευθείαν
    depends_on:
      - backend
    networks:
      - urbansync-network
    restart: unless-stopped

  # 2. BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbansync-backend
    ports:
      - "5000:5000"
    env_file: ./backend/.env # Διαβάζει το αρχείο που φτιάξαμε
    environment:
      - NODE_PATH=/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq
      - minio
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./controllers:/controllers
      - ./models:/models
      - ./middleware:/middleware
    networks:
      - urbansync-network
    restart: unless-stopped

  # 3. DATABASE
  mongodb:
    image: mongo:latest
    container_name: urbansync-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - urbansync-network
    restart: unless-stopped

  # 4. MESSAGE BROKER
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: urbansync-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - urbansync-network
    restart: unless-stopped

  # 5. OBJECT STORAGE
  minio:
    image: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: urbansync-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - urbansync-network
    restart: unless-stopped
  # 6. NODE-RED
  node-red:
    image: nodered/node-red:latest
    container_name: urbansync-nodered
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
    networks:
      - urbansync-network
    restart: unless-stopped
   # 7 THINGSBOARD
  # 9. THINGSBOARD
  thingsboard:
    image: thingsboard/tb-postgres:latest
    container_name: urbansync-thingsboard
    ports:
      - "9090:9090"
      - "1883:1883"
      - "5683:5683/udp"
    environment:
      - TB_QUEUE_TYPE=in-memory
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard
    networks:
      - urbansync-network
    restart: unless-stopped
volumes:
  mongodb_data:
  rabbitmq_data:
  minio_data:
  node_red_data:
  thingsboard_data:
  thingsboard_logs:
networks:
  urbansync-network:
    driver: bridge
